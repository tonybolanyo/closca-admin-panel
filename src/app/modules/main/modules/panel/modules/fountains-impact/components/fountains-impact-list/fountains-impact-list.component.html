<div class="col-12 pt-3">
  <div class="row">
    <div class="col-12">
      <h3 class="float-start title">
        Impacto Fuentes
      </h3>
      <button class="btn btn-primary export-button" (click)="downloadCSV()">Exportar CSV</button>
    </div>
  </div>
  <div class="row">
    <div class="pt-3 col-12 pb-4 pe-0 ps-0" *ngIf="corporates != undefined && brands != undefined">
      <app-custom-table [dataSource]="items" [paginator]="paginator" [tableConfig]="tableConfig"
        (formChanges)="filterFormChanges($event)" (sendPaginate)="paginate($event)"></app-custom-table>
    </div>
  </div>
</div>
