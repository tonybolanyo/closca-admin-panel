<div class="row">
  <div class="col-12 pt-1 pb-1">
    <h3 class="float-left title">
      <a class="button-back" (click)="navigateBack()">
        <mat-icon class="float-left back-icon">keyboard_backspace</mat-icon>
      </a>
      {{ action === "view" ? "Ver" : action === "edit" ? "Editar" : "Nuevo" }}
      Tipo Producto
    </h3>
  </div>
  <div class="col-12 pt-3">
    <div class="row">
      <div class="language-container col-12 pb-3">
        <mat-button-toggle-group #language="matButtonToggleGroup" value="es">
          <mat-button-toggle value="es">
            <img
              width="25px"
              [src]="'../../../../../../../../../assets/images/spain_flag.jpg'"
            />
            Español {{ checkSpanish() }}
          </mat-button-toggle>
          <mat-button-toggle value="en">
            <img
              width="25px"
              [src]="'../../../../../../../../../assets/images/usa_flag.jpg'"
            />
            Inglés {{ checkEnglish() }}
          </mat-button-toggle>
        </mat-button-toggle-group>
      </div>
    </div>
  </div>
  <div class="col-12 pt-3">
    <form class="w-100" [formGroup]="productTypeForm">
      <div class="row">
        <ng-container *ngIf="language.value === 'es'">
          <mat-form-field class="col-12" formGroupName="name">
            <input matInput placeholder="Nombre *" formControlName="es" />
          </mat-form-field>
          <mat-form-field class="col-12" formGroupName="description">
            <textarea
              matInput
              placeholder="Descripción"
              formControlName="es"
            ></textarea>
          </mat-form-field>
        </ng-container>
        <ng-container *ngIf="language.value === 'en'">
          <mat-form-field class="col-12" formGroupName="name">
            <input matInput placeholder="Nombre *" formControlName="en" />
          </mat-form-field>
          <mat-form-field class="col-12" formGroupName="description">
            <textarea
              matInput
              placeholder="Descripción"
              formControlName="en"
            ></textarea>
          </mat-form-field>
        </ng-container>
      </div>
    </form>
    <div class="row" *ngIf="action !== 'view'">
      <div class="buttons-container col-12 pt-4 pb-5 pl-3">
        <ng-content select="button"></ng-content>
        <button
          class="btn btn-primary send-sms-button mr-2"
          (click)="isFormCanceled = true"
          [routerLink]="routerDefinitions.productTypes + '/list'"
        >
          Cancelar
        </button>
        <button
          class="btn btn-primary ml-2"
          [disabled]="productTypeForm.invalid || !productTypeForm.dirty"
          (click)="saveForm(productTypeForm.value, productTypeForm.valid)"
        >
          Guardar
        </button>
      </div>
    </div>
  </div>
</div>
