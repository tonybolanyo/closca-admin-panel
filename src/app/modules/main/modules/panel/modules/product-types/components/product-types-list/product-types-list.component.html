<div class="col-12 pt-3">
  <div class="row">
    <div class="col-12">
      <h3 class="float-start title">
        Tipos Producto
      </h3>
      <button [routerLink]="tableConfig.buttonsConfig.baseRouterLink + '/new'" class="btn btn-primary add-button">
        <img src="./../../../../../../../../../assets/icons/add-icon.png" />
      </button>
    </div>
  </div>
  <div class="row">
    <div class="pt-3 col-12 pb-4 pe-0 ps-0">
      <app-custom-table [dataSource]="items" [tableConfig]="tableConfig" (deleteItem)="deleteItem($event)">
      </app-custom-table>
    </div>
  </div>
</div>
