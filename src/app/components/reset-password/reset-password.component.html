<div class="text-center">
    <form class="form-reset-password" [formGroup]="resetPasswordForm" (ngSubmit)="sendResetPassword(resetPasswordForm.value)">
            <img 
            [src]="'/assets/images/logo.png'"  />
            <mat-card class="reset-password-container">
            <mat-form-field class="full-width">
                <input matInput placeholder="Nueva contraseña" formControlName="password" type="password">
            </mat-form-field>
            <mat-form-field class="full-width">
                <input matInput placeholder="Repite nueva contraseña" formControlName="passwordRepeat" type="password">
            </mat-form-field>
            <div class="button-submit-container">
                <button [disabled]="resetPasswordForm.invalid" class="btn btn-lg btn-primary btn-block mt-4 pt-3 pb-3" type="submit">Guardar</button>
            </div>
            <div class="go-back-container">
                <a (click)="navigateToLogin()">Volver al inicio de sesión</a>
            </div>
        </mat-card>
        <p class="mt-4 mb-3 text-muted">&copy; Copyright  2019 Closca</p>
    </form>
</div>
